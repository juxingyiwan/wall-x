exclude: |
  (?x)^(
    tests/fixtures/rtc/|
    wall_x/_vendor/|
    wall_x/model/core/ops/csrc/|
    wall_x/model/core/ops/_cuda_ext\.py|
    wall_x/model/core/ops/_cuda_wrappers\.py|
    wall_x/model/qact/qwen2_5/modeling_qwen2_5_vl\.py|
    wall_x/model/qact/qwen2_5/modeling_qwen2_5_vl_act\.py
  )

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^deployment/

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        exclude: ^deployment/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-added-large-files
        exclude: ^assets/(rebot_walloss05_(rtc|padding)_comparison|rebot_grasp_the_(cube_to_the_bowl|pen_to_the_box|cube_into_the_closed_top_drawer))\.(mp4|gif)$
      - id: check-added-large-files
        name: check task and RTC demo video size (5 MiB limit)
        files: ^assets/(rebot_walloss05_rtc_comparison|rebot_grasp_the_(cube_to_the_bowl|pen_to_the_box|cube_into_the_closed_top_drawer))\.mp4$
        args: [--maxkb=5120]
      - id: check-added-large-files
        name: check padding demo video size (10 MiB limit)
        files: ^assets/rebot_walloss05_padding_comparison\.mp4$
        args: [--maxkb=10240]
      - id: check-added-large-files
        name: check demo preview size (4 MiB limit)
        files: ^assets/(rebot_walloss05_(rtc|padding)_comparison|rebot_grasp_the_(cube_to_the_bowl|pen_to_the_box|cube_into_the_closed_top_drawer))\.gif$
        args: [--maxkb=4096]
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
