name: Core CPU regressions

on: [push, pull_request]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements-cpu.txt
      - name: Install CPU regression dependencies
        run: |
          python -m pip install 'pip>=25,<27'
          python -m pip install --no-deps torch==2.10.0+cpu torchvision==0.25.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tests/requirements-cpu.txt
          python -m pip check
      - name: Run model, data, training and checkpoint regressions
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/deployment/client/src"
          python -m pytest tests -q
