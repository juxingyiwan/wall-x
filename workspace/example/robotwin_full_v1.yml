# RoboTwin full-data example: eight GPUs x batch 32 = effective batch 256.
# Requires prepared data and independent dev episodes; see docs/robotwin.md#full-data.
# Replace all /path/to values in a local copy. This is not a current experiment config.
# 25,000 completed updates; save every 2,500; checkpoint suffixes count completed updates.
# The scheduler step count also caps training. Use resume_from for pretrained weights.
model_type: qwen2_5
task:
  dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  ar_dof_config:
    follow_left_ee_cartesian_pos_relative: 3
    follow_left_ee_rotation_6D_relative: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 6
  agent_pos_config:
    follow_left_ee_cartesian_pos: 3
    follow_left_ee_rotation_6D: 6
    follow_left_gripper: 1
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 6
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false
model:
  backbone: qwen2_5
  config_path: /path/to/wall-oss-0.5/config.json
  processor_path: /path/to/Qwen2.5-VL-3B-Instruct
  pretrained_path: null
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
hyperparams:
  num_epoch: 100
  batch_size_per_gpu: 32
  gradient_accumulation_steps: 1
  seed: 10222
  optimizer:
    optimizer_type: adamw
    train_action_expert_only: false
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas:
    - 0.9
    - 0.95
    weight_decay: 1.0e-08
    eps: 1.0e-08
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 500
    num_training_steps: 25000
    min_lr: 1.0e-06
distributed:
  use_fsdp: true
  fsdp_sharding_strategy: full_shard
  fsdp_cpu_offload: false
  use_mixed_precision: true
  bf16: true
  use_gradient_checkpointing: true
data:
  dataset_type: lerobot
  lerobot_config:
    adapter: robotwin
    normalization:
      clip_action_targets: false
      clip_state_inputs: false
    pad_to_square: true
    repo_id: robotwin2_full27500
    root: /path/to/robotwin2_full27500_with_dev
  key_mappings:
    camera:
      observation.images.face_view: face_view
      observation.images.left_wrist_view: left_wrist_view
      observation.images.right_wrist_view: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /path/to/robotwin2_full27500_train_norm_stats.json
  episode_split_path: /path/to/robotwin2_full27500_with_dev/meta/episode_split.json
  train_test_split: 0.95
  num_workers: 4
  max_length: 1024
  # Preserve aspect ratio and center-pad each view to 224 x 224.
  resolution:
    face_view: 224
    left_wrist_view: 224
    right_wrist_view: 224
logging:
  log_name: robotwin_full27500
  log_project: lerobot_robotwin_ft
  log_entity: null
  use_wandb: false
  log_interval: 25
  gc_interval_steps: 500
  save_interval: 2500
  val_interval: 1000
  epoch_save_interval: 0
  save_on_completed_steps: true
checkpoint:
  save_path: /path/to/checkpoints/robotwin_full27500
  resume_from: /path/to/wall-oss-0.5/model.safetensors
debug:
  profile: false
  nvtx: false
