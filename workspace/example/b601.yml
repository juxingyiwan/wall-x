# Template only: edit asset paths, dataset keys and training budget before use.
# Prepare statistics with scripts.prepare_b601, then train with scripts.train_b601.
model_type: qwen2_5
task:
  dof_config:
    follow_right_arm_joint_pos: 6
    follow_right_gripper_pos: 1
    action_padding: 19
  ar_dof_config:
    follow_right_arm_joint_pos: 6
    follow_right_gripper_pos: 1
    action_padding: 19
  agent_pos_config:
    follow_right_arm_joint_pos: 6
    follow_right_gripper_pos: 1
    action_padding: 19
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false
model:
  backbone: qwen2_5
  config_path: /path/to/wall-oss/config.json
  processor_path: /path/to/compatible-processor
  pretrained_path: null
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01
hyperparams:
  num_epoch: 100
  max_optimizer_steps: 16000
  batch_size_per_gpu: 8
  gradient_accumulation_steps: 1
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas:
    - 0.9
    - 0.95
    weight_decay: 1.0e-08
    eps: 1.0e-08
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 500
    num_training_steps: 16000
    min_lr: 1.0e-06
distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true
data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: your_b601_dataset
    root: /path/to/lerobot-dataset
    b601:
      representation: b601_joint_delta_v1
      statistics_scope: train_episodes
      validation_ratio: 0.1
      target_policy: recorded_commands_v1
      command_to_physical_scale:
      - 1
      - 1
      - -1
      - -1
      - -1
      - 1
      - 6
      fps: 30
      clip_action_targets: false
      clip_state_inputs: false
  key_mappings:
    camera:
      observation.images.front: front_view
      observation.images.side: side_view
    state: observation.state
    action: action
  norm_stats_path: /path/to/generated-statistics.json
  num_workers: 0
  max_length: 1024
  resolution:
    front_view: 256
    side_view: 256
  task_sampling: sqrt
logging:
  log_name: b601_example
  log_project: b601
  log_entity: null
  use_wandb: false
  log_interval: 10
  save_interval: 4000
  val_interval: 1000000
  epoch_save_interval: 20
checkpoint:
  save_path: /path/to/new-checkpoints
  resume_from: /path/to/wall-oss/model.safetensors
debug:
  profile: false
  nvtx: false
